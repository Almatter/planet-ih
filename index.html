<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1713">
  <meta name="description" content="Meet friends in the Isekai Hell tea house.">
  <title>Planet IH</title>
  <link rel="stylesheet" href="./style.css?v=5">
  <script type="module" src="./game.js?v=5"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <div class="brand"><span class="mark" aria-hidden="true">▦</span><h1>Planet IH</h1></div>
      <p id="mode" class="pill">Solo</p>
    </header>
    <div class="layout">
      <section class="panel room-panel" aria-labelledby="room-title">
        <h2 id="room-title">Room</h2>
        <p id="status" role="status">Play solo or invite friends to share the field.</p>
        <div id="room-name">
          <label for="name">Display name</label>
          <input id="name" maxlength="18" autocomplete="off" placeholder="Traveler">
        </div>
        <div id="choices" class="actions">
          <button id="host" class="primary">Host room</button>
          <button id="join">Join room</button>
        </div>
        <div id="hosting" hidden>
          <button id="invite" class="primary wide">Create invite</button>
          <div id="offer" hidden>
            <label for="invite-code">Send this link to one friend</label>
            <textarea id="invite-code" rows="2" readonly spellcheck="false"></textarea>
            <button id="copy-invite">Copy invite link</button>
            <button id="discord-invite">Copy Discord invite</button>
            <label for="reply-in">Paste your friend’s reply code</label>
            <textarea id="reply-in" rows="2" autocomplete="off" spellcheck="false"></textarea>
            <button id="accept" class="primary wide">Connect guest</button>
            <button id="cancel-invite" class="wide">Cancel invite</button>
          </div>
        </div>
        <div id="joining" hidden>
          <div id="offer-entry">
            <label for="offer-in">Paste the host’s invite link</label>
            <textarea id="offer-in" rows="2" autocomplete="off" spellcheck="false"></textarea>
          </div>
          <button id="reply" class="primary wide">Generate reply</button>
          <div id="answer" hidden>
            <label for="reply-code">Send this reply code to the host</label>
            <textarea id="reply-code" rows="2" readonly spellcheck="false"></textarea>
            <button id="copy-reply" class="primary wide">Copy reply code</button>
            <button id="discord-reply" class="wide">Copy Discord reply</button>
          </div>
        </div>
        <button id="leave" class="wide" hidden>Leave room</button>
      </section>
      <section class="play" aria-labelledby="field-title">
        <div class="bar"><h2 id="field-title">Isekai Hell Tea House</h2><span id="count">1 player</span></div>
        <canvas id="field" width="720" height="500" aria-label="Tea house with named player blocks. Click or tap the floor to move. Keyboard movement is available with WASD or arrow keys."></canvas>
        <section class="chat" aria-labelledby="chat-title">
          <div class="bar chat-heading"><h2 id="chat-title">Room chat</h2><span id="chat-count">0 / 100</span></div>
          <div id="chat-history" role="log" aria-labelledby="chat-title" tabindex="0">
            <p id="chat-empty">No messages yet.</p>
            <ol id="chat-log"></ol>
          </div>
          <form id="chat-form">
            <input id="message" aria-label="Chat message" aria-describedby="chat-count" autocomplete="off" placeholder="Host or join to chat" disabled>
            <button id="send-chat" class="primary" disabled>Send</button>
          </form>
          <p id="chat-status" role="status" hidden></p>
        </section>
      </section>
      <section class="panel roster-panel" aria-labelledby="players-title">
        <h2 id="players-title">Players</h2>
        <ul id="players"></ul>
      </section>
    </div>
  </main>
</body>
</html>
