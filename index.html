<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10221e">
  <meta name="description" content="A small browser-to-browser multiplayer playground.">
  <title>Planet IH</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./game.js?v=2"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <div class="brand"><span class="mark" aria-hidden="true">▦</span><h1>Planet IH</h1></div>
      <p id="mode" class="pill">Solo</p>
    </header>
    <div class="layout">
      <section class="play" aria-labelledby="field-title">
        <div class="bar"><h2 id="field-title">The Field</h2><span id="count">1 player</span></div>
        <canvas id="field" width="720" height="500" aria-label="Playfield with named player blocks. Move with WASD, arrow keys, or the direction buttons."></canvas>
        <div class="controls">
          <p class="keyboard-tip">Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys.</p>
          <p class="touch-tip">Hold a direction to move.</p>
          <div class="pad" role="group" aria-label="Touch movement">
            <button data-move="up" aria-label="Move up">▲</button>
            <button data-move="left" aria-label="Move left">◀</button>
            <button data-move="down" aria-label="Move down">▼</button>
            <button data-move="right" aria-label="Move right">▶</button>
          </div>
        </div>
      </section>
      <aside>
        <section class="panel" aria-labelledby="room-title">
          <h2 id="room-title">Room</h2>
          <label for="name">Display name</label>
          <input id="name" maxlength="18" autocomplete="off" placeholder="Traveler">
          <div id="choices" class="actions">
            <button id="host" class="primary">Host room</button>
            <button id="join">Join room</button>
          </div>
          <div id="hosting" hidden>
            <button id="invite" class="primary wide">Create invite</button>
            <div id="offer" hidden>
              <label for="invite-code">Send this link to one friend</label>
              <textarea id="invite-code" rows="2" readonly spellcheck="false"></textarea>
              <button id="copy-invite">Copy invite link</button>
              <label for="reply-in">Paste your friend’s reply code</label>
              <textarea id="reply-in" rows="2" autocomplete="off" spellcheck="false"></textarea>
              <button id="accept" class="primary wide">Connect guest</button>
              <button id="cancel-invite" class="wide">Cancel invite</button>
            </div>
          </div>
          <div id="joining" hidden>
            <label for="offer-in">Paste the host’s invite link</label>
            <textarea id="offer-in" rows="2" autocomplete="off" spellcheck="false"></textarea>
            <button id="reply" class="primary wide">Generate reply</button>
            <div id="answer" hidden>
              <label for="reply-code">Send this reply code to the host</label>
              <textarea id="reply-code" rows="2" readonly spellcheck="false"></textarea>
              <button id="copy-reply">Copy reply code</button>
            </div>
          </div>
          <button id="leave" class="wide" hidden>Leave room</button>
          <p id="status" role="status">Play solo or invite friends to share the field.</p>
        </section>
        <section class="panel" aria-labelledby="players-title">
          <h2 id="players-title">Players</h2>
          <ul id="players"></ul>
        </section>
      </aside>
    </div>
  </main>
</body>
</html>
